<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate Image Data</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Image Data Summary</h2>

        {% if train %}
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Dataset Information</h5>
                    <p class="card-text"><strong>Total Images:</strong> {{ data }}</p>
                    <p class="card-text"><strong>Training Images:</strong> {{ train }}</p>
                    <p class="card-text"><strong>Validation Images:</strong> {{ validation }}</p>
                </div>
            </div>
        {% else %}
            <div class="alert alert-warning">
                No image data available. Please check your dataset.
            </div>
        {% endif %}

    </div>
</body>
</html>
