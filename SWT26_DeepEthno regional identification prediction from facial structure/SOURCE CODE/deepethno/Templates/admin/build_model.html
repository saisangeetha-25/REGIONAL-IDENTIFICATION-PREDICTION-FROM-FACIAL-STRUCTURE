<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Build CNN Model</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Yolo8 Model Status</h2>

        {% if data %}
            <div class="alert alert-success">
                {{ data }}
            </div>
        {% endif %}

        {% if acc %}
            <div class="card mt-3">
                <div class="card-body">
                    <h5 class="card-title">Training Summary</h5>
                    <p class="card-text"><strong>{{ acc }}</strong></p>
                </div>
            </div>
        {% endif %}

        
    </div>
</body>
</html>
