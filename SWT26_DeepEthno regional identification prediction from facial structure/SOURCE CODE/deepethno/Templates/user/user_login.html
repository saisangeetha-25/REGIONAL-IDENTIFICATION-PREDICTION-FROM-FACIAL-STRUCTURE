<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>DeepEthno: User Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<div class="container-fluid sticky-top px-0">
    <nav class="navbar navbar-expand-lg navbar-dark bg-light py-3 px-4">
        <a href="index.html" class="navbar-brand p-0">
            <h1 class="text-secondary display-6"><i class="fas fa-brain text-primary me-3"></i>
                Regional identification prediction from facial structure
            </h1>
        </a>
         <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                    <span class="fa fa-bars"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <div class="navbar-nav ms-auto pt-2 pt-lg-0">
                        <a href="/" class="nav-item nav-link ">Home</a>

                        <a href="/admin_login" class="nav-item nav-link">Admin</a>
                        <a href="/user_registration" class="nav-item nav-link active">User</a>

                    </div>

                </div>
    </nav>
</div>

<!-- Login Form -->
<div class="carousel-item active">
    <img src="{% static 'img/user3.png' %}" class="img-fluid w-100" alt="Background"/>
    <div class="carousel-caption d-flex flex-column align-items-center justify-content-center" style="top:0; left:0; width:100%; height:100%;">
        <div class="bg-dark bg-opacity-75 rounded-4 p-5 shadow-lg" style="max-width: 450px; width:100%;">
            <h2 class="text-white mb-4 text-center"><i class="fas fa-sign-in-alt me-2"></i>User Login</h2>
            
            <!-- Display error message -->
            {% if msg %}
                <div class="alert alert-danger">{{ msg }}</div>
            {% endif %}
            
            <form method="post" action="/user_login_action/">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="username" class="form-control rounded-pill py-3 px-4 bg-dark text-white border-0 shadow-sm" 
                           id="username" name="username" placeholder="👤 username" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control rounded-pill py-3 px-4 bg-dark text-white border-0 shadow-sm" 
                           id="password" name="password" placeholder="🔒 Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
                <p class="mt-3 text-center">
                    Don't have an account? <a href="/user_registration/" style="color:white;">Register</a>
                </p>
            </form>
        </div>
    </div>
</div>

<!-- Back to Top -->
<a href="#" class="btn btn-secondary btn-lg-square back-to-top"><i class="fa fa-arrow-up"></i></a>   

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
